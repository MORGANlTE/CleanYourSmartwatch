[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanmywatch"
version = "0.1.0"
description = "Conservative, local-first Wear OS audit and reversible optional-app disabling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["typer>=0.16,<1", "rich>=14,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
cleanmywatch = "cleanmywatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cleanmywatch = ["profiles.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
